<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jquery05-CDN</title>
<style>
	h1 {color:white;}
	.high-light-0 { background-color:red; 		}
	.high-light-1 { background-color:orange; 	}
	.high-light-2 { background-color:yellow; color:black;	}
	.high-light-3 { background-color:green;		}
	.high-light-4 { background-color:blue; 		}
	.high-light-5 { background-color:navy; 		}
	.high-light-6 { background-color:purple; 	}
	
</style>
<!-- jquery CDN -->
<script src='https://code.jquery.com/jquery-4.0.0.min.js'></script>
<script>
	$( function () {
		$('h1').each( function (index, item) { // querySelectorAll(h1)을 의미하고, h1을 찾으면 배열로 받게됨, // h1 tag에 대한 each 
			//console.log(item)
			//console.dir(item)
			//item.css('background-color', '#A0A0A0') // item.css() not a function(), item안에는 css 함수가 없음 그래서 안 먹음, item 자체는 javascript 객체임
			console.log($(item)) // $(item) wrappered class가 됨
			//$(item).css('background-color', '#A0A0A0') // css() 함수는 jquery 꺼임
			$(item).addClass('high-light-' + index)
		} );             
	})
</script>
</head>
<body>
    <h1>item - 0</h1>
    <h1>item - 1</h1>
    <h1>item - 2</h1>
    <h1>item - 3</h1>
    <h1>item - 4</h1>
    <h1>item - 5</h1>
    <h1>item - 6</h1>
</body>
</html>
