<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
/* 	h1, p { color : orange; } */
</style>
<title>Jquery03-CDN</title>
<!-- jquery CDN -->
<script src='https://code.jquery.com/jquery-4.0.0.min.js'></script>
<script>
	$( function () {
		// odd : 홀수, evnet : 짝수
		$('tr:odd').css('background', '#9f9f9f')
		$('tr:even').css('background', '#f9f9f9')
		$('tr:first').css({
			'background-color': '#000000',
			'color': '#ffffff'
		})
	})
</script>
</head>
<body>
 <table>
    <tr><th>이름</th><th>혈액형</th><th>지역</th></tr>
    <tr><td>강호동</td><td>AB형</td><td>해운대구</td></tr>
    <tr><td>서장훈</td><td>A형</td><td>동래구</td></tr>
    <tr><td>박세리</td><td>B형</td><td>동래구</td></tr>
    <tr><td>김연아</td><td>A형</td><td>동래구</td></tr>
    <tr><td>박찬호</td><td>A형</td><td>동래구</td></tr>  
  </table>
</body>
</html>
